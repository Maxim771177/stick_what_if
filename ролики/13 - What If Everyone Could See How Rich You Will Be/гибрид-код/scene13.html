<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head><body><canvas id="c" width="1920" height="1080"></canvas>
<script type="module">
import * as G from "/hybrid13/engine13.js";

const { W, HT, K, PLACES, camAt, worldTransform, drawNum, deltaLabel, fmtVal, buildNumTimeline, numAt, mk, clamp, lerp, sm, prog, SPEED } = G;
let _r; window.ready = new Promise(r => _r = r);
await G.boot();

const cv = document.getElementById('c'), C = cv.getContext('2d'); const sc = mk(W, HT), sx = sc.getContext('2d'), layerF = mk(W, HT), layerN = mk(W, HT);

function renderScene(t, sceneObj) {
  const base = sceneObj || findScene(t); const meta = SC[base.id] || {}; const sc_ = { ...base, ...meta, texts: base.texts }; const lt = t - base.start, D = base.end - base.start;
  if (meta.camFn) sc_.cam = [meta.camFn(lt, D)]; const cm = camAt(sc_, lt, D); const k = new K(sc_, t, cm); const place = PLACES[sc_.place] || PLACES.VOID;
  if (meta.fn) meta.fn(k, G); else k.errs.push('ERROR no-scene ' + base.id);
  // число Leon
  const L = k.heads.LEON; if (L && meta.noNum !== true && meta.numOwner !== false) { const n = numAt(NUMEV, t); if (n && base.id >= 'S005' && base.id <= 'S134') {
    const txt = meta.numText ? meta.numText(t, n) : fmtVal(n.d < .7 && n.change ? Math.round(n.v / 1e7) * 1e7 : n.v); const flash = n.change && n.d < 1 ? 1 : 0; const fs = meta.numFs || 66; const nx = L.head[0] + (meta.numDx || 0), ny = L.top[1] - 70 * L.se - fs * .5 - (meta.numUp || 0);
    let nx2 = nx, ny2 = ny; { const wTxt = txt.length * fs * .52 * cm.z, hTxt = fs * 1.3 * cm.z; let [px, py] = G.toScreen(cm, nx, ny); const half = wTxt / 2 + 24; const cx = Math.min(W - half - (n.change ? 0 : 0), Math.max(half, px)), cy = Math.max(hTxt / 2 + 14, Math.min(HT - hTxt / 2 - 120, py)); if (cx !== px || cy !== py) { nx2 = nx + (cx - px) / cm.z; ny2 = ny + (cy - py) / cm.z; } k.numRect = { x0: cx - half, x1: cx + half, y0: cy - hTxt / 2 - 10, y1: cy + hTxt / 2 + 10 }; }
    const kk0 = n.first ? G.back(prog(n.d, 0, .55)) : 1; if (meta.mirror && k.heads.OWEN) { const O = k.heads.OWEN, mk0 = n.first ? G.back(prog(n.d, 0, .55)) : 1; k.push(60, (c) => drawNum(c, O.head[0] - (meta.numDx || 0), ny2 + (O.top[1] - L.top[1]), txt, { t, fs, flash, up: n.up, k: mk0 })); }
    k.push(60, (c) => { drawNum(c, nx2, ny2, txt, { t, fs, flash, up: n.up, k: kk0 }); if (n.change && n.d < 2) deltaLabel(c, nx2 + (meta.deltaDx ?? 330 * fs / 66), ny2 - 20 + (meta.deltaDy || 0), n.label || '', n.up, sm(prog(n.d, 0, .3)) * (1 - sm(prog(n.d, 1.5, 2)))); }); } }
  // слои

  sx.setTransform(1, 0, 0, 1, 0, 0); sx.fillStyle = place.bg || '#000'; sx.fillRect(0, 0, W, HT); sx.filter = 'blur(3px)'; sx.drawImage(layerF, 0, 0); sx.filter = 'none';
  worldTransform(sx, cm, 1); place.mid && place.mid(sx, t, k); if (meta.mid) meta.mid(sx, t, k);

  const n2 = layerN.getContext('2d'); n2.setTransform(1, 0, 0, 1, 0, 0); n2.clearRect(0, 0, W, HT); worldTransform(n2, cm, 1.45); place.near && place.near(n2, t, k);

  const g = sx.createRadialGradient(W / 2, HT / 2, HT * .45, W / 2, HT / 2, HT * .95); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.26)'); sx.fillStyle = g; sx.fillRect(0, 0, W, HT);

}
// tOut — секунды выходного видео (после ускорения ×1,2), как в шаблоне
const N = 3, SHUT = .5 / 60 * SPEED;
window.draw = function (tOut) { const t0 = tOut * SPEED; G.E.t = tOut; C.setTransform(1, 0, 0, 1, 0, 0); C.globalAlpha = 1; for (let i = 0; i < N; i++) { const tt = t0 + (i / (N - 1) - .5) * SHUT * 2; renderScene(Math.max(0, tt)); C.globalAlpha = 1 / (i + 1); C.drawImage(sc, 0, 0); } C.globalAlpha = 1; return true; };

document.fonts.ready.then(() => _r(true));
